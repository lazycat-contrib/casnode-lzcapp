version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  # The embed: target cannot be an image version source, so the version comes
  # from the git tag this package tracks.
  version_source:
    type: git
build:
  toolchains:
    - kind: docker
  run_buildscript: true
images:
  - id: casnode
    target: service
    service: casnode
    image: embed:casnode
stores:
  official:
    enabled: false
  private:
    enabled: true
    name: Casnode
    summary: 开源论坛系统，Discourse 风格
    skip_if_version_exists: true
